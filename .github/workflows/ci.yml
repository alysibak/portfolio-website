name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays: catch links that broke without any change here.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  site:
    name: Types, content, build, and browser tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # prebuild runs the content check (scripts/verify-content.mjs).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run links
